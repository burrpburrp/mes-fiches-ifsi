# Quand Oksana ouvre un ticket ou y répond, pose l'étiquette « réponse-oksana ».
# Cette pose d'étiquette est un événement « ticket » (labeled) que GitHub transmet à la
# tâche Claude « Tickets d'Oksana (GitHub) ». Cette tâche n'accepte qu'un seul déclencheur,
# d'où une seule étiquette pour les deux cas (nouveau ticket et réponse).
name: Signaler les tickets et réponses d'Oksana

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  etiquette:
    if: >-
      (github.event_name == 'issues' && github.event.issue.user.login == 'Ici-Oksana') ||
      (github.event_name == 'issue_comment' && github.event.comment.user.login == 'Ici-Oksana' && !github.event.issue.pull_request)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const params = { ...context.repo, issue_number: context.issue.number, name: 'réponse-oksana' };
            // On retire puis on remet l'étiquette, pour que chaque réponse produise un nouvel événement.
            await github.rest.issues.removeLabel(params).catch(() => {});
            await github.rest.issues.addLabels({ ...context.repo, issue_number: context.issue.number, labels: ['réponse-oksana'] });
